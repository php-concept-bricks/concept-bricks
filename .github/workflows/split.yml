name: Split packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install splitsh-lite
        run: |
          curl -sL https://github.com/splitsh/lite/releases/download/v1.0.1/sh-linux-amd64 -o /usr/local/bin/splitsh-lite
          chmod +x /usr/local/bin/splitsh-lite

      - name: Push split repos (+ same tag when release)
        env:
          SPLIT_PUSH_TOKEN: ${{ secrets.SPLIT_PUSH_TOKEN }}
        run: |
          if [[ -z "${SPLIT_PUSH_TOKEN:-}" ]]; then
            echo "SPLIT_PUSH_TOKEN secret is required for push." >&2
            exit 1
          fi

          TAG=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "Release tag: $TAG"
          fi

          while IFS=$'\t' read -r prefix repo; do
            echo "Splitting $prefix -> $repo"
            SHA=$(splitsh-lite --prefix="$prefix" -- HEAD)
            REMOTE="https://x-access-token:${SPLIT_PUSH_TOKEN}@github.com/php-concept-bricks/${repo}.git"
            git push "$REMOTE" "${SHA}:refs/heads/main" --force
            if [[ -n "$TAG" ]]; then
              git push "$REMOTE" "${SHA}:refs/tags/${TAG}"
            fi
          done < <(php -r '
            $map = json_decode(file_get_contents("packages.json"), true)["packages"];
            foreach ($map as $path => $repo) {
              echo $path, "\t", $repo, "\n";
            }
          ')
